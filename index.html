<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฝากข้อความ & รูปภาพ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    
    .form-box { 
      background: rgba(255,255,255,0.08); 
      backdrop-filter: blur(10px); 
      padding: 25px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 480px; 
      border: 1px solid rgba(243, 209, 99, 0.4); 
      box-shadow: 0 0 20px rgba(0,0,0,0.5); 
    }

    /* เมนูสลับแท็บ */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      color: #888;
      border: 1px solid #444;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: #f3d163;
      color: #000;
      border-color: #f3d163;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    label { font-size: 0.9rem; color: #ccc; }
    input[type="text"], input[type="file"], textarea, button { width: 100%; margin-top: 8px; margin-bottom: 16px; padding: 12px; border-radius: 8px; border: 1px solid #444; background: rgba(0,0,0,0.5); color: #fff; font-size: 0.95rem; }
    textarea { resize: vertical; }
    
    #submit-btn { background: #f3d163; font-weight: 600; cursor: pointer; color: #000; border: none; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
    #submit-btn:hover { background: #fff; }
    #submit-btn:disabled { background: #666; cursor: not-allowed; }

    /* รายการข้อความและรูปภาพในแท็บ "ดูทั้งหมด" */
    .wishes-list {
      max-height: 520px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 4px;
    }
    .wish-item {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(243, 209, 99, 0.3);
      border-radius: 10px;
      padding: 14px;
    }
    .wish-item .sender {
      color: #f3d163;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .wish-item .msg {
      font-size: 0.9rem;
      color: #eee;
      white-space: pre-line;
      word-break: break-word;
      margin-bottom: 8px;
    }

    /* ปรับแต่งส่วนแสดงรูปภาพตามขนาดจริง */
    .wish-item img {
      width: 100%;
      height: auto;           /* ปรับความสูงตามอัตราส่วนจริงของภาพ */
      display: block;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="form-box">
    <div class="tab-container">
      <button type="button" class="tab-btn active" id="tab-upload-btn">ฝากข้อความ</button>
      <button type="button" class="tab-btn" id="tab-view-btn">ดูข้อความทั้งหมด</button>
    </div>

    <!-- แท็บ 1: ฟอร์มอัปโหลด -->
    <div id="upload-tab" class="tab-content active">
      <form id="upload-form">
        <label for="user-name">ชื่อผู้ส่ง (ไม่บังคับ):</label>
        <input type="text" id="user-name" placeholder="ใส่ชื่อของคุณ...">

        <label for="user-message">ข้อความอวยพร (ไม่บังคับ):</label>
        <textarea id="user-message" rows="4" placeholder="พิมพ์ข้อความตรงนี้..."></textarea>
        
        <label for="user-image">อัปโหลดรูปภาพ (ไม่บังคับ):</label>
        <input type="file" id="user-image" accept="image/*">
        
        <button type="submit" id="submit-btn">ส่งข้อมูล</button>
        <button type="button" id="cd-btn">ไปหน้าเคาท์ดาวน์</button>
      </form>
    </div>

    <!-- แท็บ 2: ดูข้อความทั้งหมด -->
    <div id="view-tab" class="tab-content">
      <div id="wishes-list" class="wishes-list">
        <p style="text-align:center; color:#aaa;">กำลังโหลดข้อมูล...</p>
      </div>
    </div>
  </div>

  <script type="module" src="./upload.js"></script>
</body>
</html>
